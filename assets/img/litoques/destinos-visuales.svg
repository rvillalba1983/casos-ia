<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
  <defs>
    <linearGradient id="patio" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a2e1c"/><stop offset="1" stop-color="#c47a3a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="560" fill="#f7efe2"/>
  <text x="600" y="52" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-style="italic" fill="#3b2a20">Una sola idea visual, varios destinos con medidas distintas</text>

  <g font-family="Helvetica, Arial, sans-serif">
    <!-- Concepto -->
    <rect x="40" y="120" width="230" height="300" rx="16" fill="#fff" stroke="#b7791f" stroke-width="2"/>
    <text x="60" y="155" font-size="13" font-weight="700" letter-spacing="2" fill="#b7791f">DIRECCIÓN ARTÍSTICA</text>
    <text x="60" y="195" font-size="17" fill="#3b2a20">Taberna o patio</text>
    <text x="60" y="218" font-size="17" fill="#3b2a20">andaluz, luz cálida,</text>
    <text x="60" y="241" font-size="17" fill="#3b2a20">tono cinematográfico</text>
    <text x="60" y="281" font-size="17" fill="#3b2a20">El guitarrista como</text>
    <text x="60" y="304" font-size="17" fill="#3b2a20">figura central</text>
    <text x="60" y="344" font-size="17" fill="#3b2a20">Textos: «Litoques»</text>
    <text x="60" y="367" font-size="17" fill="#3b2a20">y «Lito»</text>

    <path d="M285 270 h40 m-12 -10 l12 10 l-12 10" stroke="#3b2a20" stroke-width="3" fill="none"/>

    <!-- Portada 1:1 -->
    <rect x="345" y="140" width="220" height="220" rx="6" fill="url(#patio)"/>
    <path d="M375 360 V245 Q455 170 535 245 V360" fill="none" stroke="#f2c98d" stroke-width="3" opacity="0.6"/>
    <text x="455" y="215" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-style="italic" fill="#fbe7c6">Litoques</text>
    <text x="455" y="340" text-anchor="middle" font-size="14" letter-spacing="3" fill="#fbe7c6">LITO</text>
    <text x="455" y="395" text-anchor="middle" font-size="16" font-weight="700" fill="#3b2a20">Portada del disco</text>
    <text x="455" y="417" text-anchor="middle" font-size="14" fill="#6b5a4c">formato cuadrado</text>

    <!-- Fondo 2660x1140 -->
    <rect x="600" y="140" width="330" height="141" rx="6" fill="url(#patio)"/>
    <line x1="765" y1="140" x2="765" y2="281" stroke="#fbe7c6" stroke-dasharray="5 4" opacity="0.6"/>
    <text x="765" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#3b2a20">Fondo visual para Spotify</text>
    <text x="765" y="322" text-anchor="middle" font-size="14" fill="#6b5a4c">referencia de trabajo: 2660 × 1140 px</text>
    <text x="765" y="342" text-anchor="middle" font-size="13" fill="#b5402a">(comprobar la especificación vigente)</text>

    <!-- Vídeo 16:9 -->
    <rect x="975" y="140" width="190" height="107" rx="6" fill="url(#patio)"/>
    <path d="M1060 175 l24 18 l-24 18 z" fill="#fbe7c6"/>
    <text x="1070" y="270" text-anchor="middle" font-size="16" font-weight="700" fill="#3b2a20">Vídeos</text>
    <text x="1070" y="292" text-anchor="middle" font-size="14" fill="#6b5a4c">horizontales o verticales</text>
    <text x="1070" y="312" text-anchor="middle" font-size="14" fill="#6b5a4c">según la plataforma</text>

    <!-- Separación generar vs procesar -->
    <rect x="345" y="450" width="820" height="72" rx="12" fill="#fff" stroke="#e4ddd3"/>
    <rect x="365" y="470" width="14" height="14" rx="3" fill="#b7791f"/>
    <text x="388" y="482" font-size="15" fill="#3b2a20"><tspan font-weight="700">IA generativa:</tspan> crear o transformar la imagen (estilos, ambientes, encuadres)</text>
    <rect x="365" y="494" width="14" height="14" rx="3" fill="#2b5f8f"/>
    <text x="388" y="506" font-size="15" fill="#3b2a20"><tspan font-weight="700">Herramienta convencional:</tspan> recortar, redimensionar, convertir y comprobar medidas</text>
  </g>
</svg>
