  <text x="800" y="170" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" letter-spacing="4" fill="#f2c98d">UN DISCO HECHO EN CASA · CON LA IA COMO COMPAÑERA DE TALLER</text>

