      <circle cx="1270" cy="571" r="6"/><circle cx="1330" cy="571" r="6"/><circle cx="1390" cy="571" r="6"/><circle cx="1450" cy="571" r="6"/><circle cx="1510" cy="571" r="6"/><circle cx="1570" cy="571" r="6"/>
    </g>
