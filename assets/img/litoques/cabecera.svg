<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1a14"/>
      <stop offset="0.6" stop-color="#5a2e1c"/>
      <stop offset="1" stop-color="#8a4a26"/>
    </linearGradient>
    <radialGradient id="luz" cx="0.5" cy="0.5" r="0.5">
