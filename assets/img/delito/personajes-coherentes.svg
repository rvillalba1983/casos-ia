<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <rect width="1200" height="600" fill="#f6f0e2"/>
  <text x="600" y="52" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-style="italic" fill="#1f1f2e">Mantener a Lito y Pachi: la referencia manda</text>

  <g font-family="Helvetica, Arial, sans-serif">
    <!-- Referencia -->
    <rect x="40" y="100" width="320" height="360" rx="16" fill="#fff" stroke="#c8102e" stroke-width="2"/>
    <text x="64" y="134" font-size="13" font-weight="700" letter-spacing="2" fill="#c8102e">1 · REFERENCIA FIABLE</text>
    <rect x="70" y="155" width="260" height="190" rx="6" fill="#1f1f2e"/>
    <circle cx="160" cy="256" r="28" fill="#f3ead8"/><path d="M118 330 q42 -90 84 0 z" fill="#f3ead8"/>
    <circle cx="245" cy="266" r="24" fill="#e8c9a0"/><path d="M208 330 q37 -80 74 0 z" fill="#e8c9a0"/>
    <text x="80" y="176" font-size="12" fill="#f3ead8" opacity="0.7">pág. 3</text>
    <text x="64" y="380" font-size="16" font-weight="700" fill="#1f1f2e">Página 3 del libro</text>
    <text x="64" y="404" font-size="15" fill="#5d5a55">identificada en el flujo de</text>
    <text x="64" y="424" font-size="15" fill="#5d5a55">trabajo como el archivo «page 04»</text>

    <path d="M370 280 h40 m-12 -10 l12 10 l-12 10" stroke="#1f1f2e" stroke-width="3" fill="none"/>

    <!-- Instrucción -->
    <rect x="420" y="100" width="340" height="360" rx="16" fill="#fff" stroke="#b7791f" stroke-width="2"/>
    <text x="444" y="134" font-size="13" font-weight="700" letter-spacing="2" fill="#b7791f">2 · INSTRUCCIÓN CONCRETA</text>
    <rect x="444" y="155" width="292" height="62" rx="10" fill="#fbeee9"/>
    <text x="460" y="181" font-size="15" fill="#c8102e" text-decoration="line-through">«Dibuja al mismo personaje»</text>
    <text x="460" y="203" font-size="13" fill="#c8102e">demasiado vago</text>
    <rect x="444" y="232" width="292" height="200" rx="10" fill="#fdf5e6"/>
    <text x="460" y="260" font-size="15" fill="#1f1f2e">• Respeta los modelos de la</text>
    <text x="474" y="280" font-size="15" fill="#1f1f2e">referencia adjunta</text>
    <text x="460" y="310" font-size="15" fill="#1f1f2e">• Describe la escena nueva</text>
    <text x="460" y="340" font-size="15" fill="#1f1f2e">• Di qué rasgos no pueden</text>
    <text x="474" y="360" font-size="15" fill="#1f1f2e">cambiar</text>
    <text x="460" y="390" font-size="15" fill="#1f1f2e">• Pide el estilo y el papel</text>
    <text x="474" y="410" font-size="15" fill="#1f1f2e">del propio libro</text>

    <path d="M770 280 h40 m-12 -10 l12 10 l-12 10" stroke="#1f1f2e" stroke-width="3" fill="none"/>

    <!-- Revisión -->
    <rect x="820" y="100" width="340" height="360" rx="16" fill="#fff" stroke="#2f7d4f" stroke-width="2"/>
    <text x="844" y="134" font-size="13" font-weight="700" letter-spacing="2" fill="#2f7d4f">3 · REVISIÓN DEL AUTOR</text>
    <g font-size="16" fill="#1f1f2e">
      <rect x="846" y="160" width="22" height="22" rx="4" fill="none" stroke="#2f7d4f" stroke-width="2"/><text x="880" y="177">¿Mismos rasgos y cara?</text>
      <rect x="846" y="200" width="22" height="22" rx="4" fill="none" stroke="#2f7d4f" stroke-width="2"/><text x="880" y="217">¿Proporciones coherentes?</text>
      <rect x="846" y="240" width="22" height="22" rx="4" fill="none" stroke="#2f7d4f" stroke-width="2"/><text x="880" y="257">¿Ropa y detalles iguales?</text>
      <rect x="846" y="280" width="22" height="22" rx="4" fill="none" stroke="#2f7d4f" stroke-width="2"/><text x="880" y="297">¿Encaja con las otras páginas?</text>
      <rect x="846" y="320" width="22" height="22" rx="4" fill="none" stroke="#2f7d4f" stroke-width="2"/><text x="880" y="337">¿El texto se lee bien?</text>
    </g>
    <text x="846" y="392" font-size="15" fill="#5d5a55">Si algo falla: corrección</text>
    <text x="846" y="412" font-size="15" fill="#5d5a55">delimitada y vuelta al paso 2</text>

    <!-- bucle -->
    <path d="M990 470 C990 540 590 540 590 470" fill="none" stroke="#c8102e" stroke-width="2.5" stroke-dasharray="8 6"/>
    <path d="M582 482 l8 -14 l8 14" fill="none" stroke="#c8102e" stroke-width="2.5"/>
    <text x="790" y="565" text-anchor="middle" font-size="15" font-weight="700" fill="#c8102e">La consistencia no está garantizada: hay que comprobarla en cada imagen</text>
  </g>
</svg>
