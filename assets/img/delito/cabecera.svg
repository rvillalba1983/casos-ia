<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700">
  <defs>
    <pattern id="renglones" width="40" height="34" patternUnits="userSpaceOnUse">
      <line x1="0" y1="33" x2="40" y2="33" stroke="#cfd9e6" stroke-width="1.2"/>
    </pattern>
    <filter id="sombra" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1600" height="700" fill="#f3ead8"/>

  <!-- Hoja de cuaderno inclinada -->
  <g transform="rotate(-3 420 380)" filter="url(#sombra)">
    <rect x="150" y="120" width="520" height="460" fill="#fffdf6"/>
    <rect x="150" y="120" width="520" height="460" fill="url(#renglones)"/>
    <line x1="210" y1="120" x2="210" y2="580" stroke="#e7a3a3" stroke-width="2"/>
    <g fill="none" stroke="#3a3a52" stroke-width="3" stroke-linecap="round" opacity="0.7">
      <path d="M232 180 q20 -14 40 0 t40 0 t40 0 t40 0 t40 0"/>
      <path d="M232 248 q18 -12 36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0"/>
      <path d="M232 282 q18 -12 36 0 t36 0 t36 0 t36 0"/>
      <path d="M232 350 q18 -12 36 0 t36 0 t36 0 t36 0 t36 0 t36 0"/>
      <path d="M232 384 q18 -12 36 0 t36 0 t36 0"/>
    </g>
    <path d="M240 450 c10 -30 40 -30 50 0 c10 -30 40 -30 50 0 c-10 30 -50 50 -50 60 c0 -10 -40 -30 -50 -60 z" fill="#c8102e" opacity="0.85"/>
    <circle cx="610" cy="500" r="32" fill="none" stroke="#c8102e" stroke-width="3"/>
    <text x="610" y="510" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#c8102e">?</text>
  </g>

  <!-- Polaroid con globo -->
  <g transform="rotate(4 1180 360)" filter="url(#sombra)">
    <rect x="980" y="150" width="400" height="430" fill="#fffdf6"/>
    <rect x="1005" y="175" width="350" height="320" fill="#1f1f2e"/>
    <!-- dos figuras abstractas -->
    <circle cx="1120" cy="352" r="34" fill="#f3ead8"/>
    <path d="M1070 440 q50 -100 100 0 z" fill="#f3ead8"/>
    <circle cx="1245" cy="362" r="30" fill="#e8c9a0"/>
    <path d="M1200 440 q45 -90 90 0 z" fill="#e8c9a0"/>
    <!-- globo de diálogo -->
    <path d="M1180 205 h120 a18 18 0 0 1 18 18 v38 a18 18 0 0 1 -18 18 h-70 l-22 22 v-22 h-28 a18 18 0 0 1 -18 -18 v-38 a18 18 0 0 1 18 -18 z" fill="#fff"/>
    <text x="1240" y="250" text-anchor="middle" font-family="Georgia, serif" font-size="44" font-style="italic" fill="#1f1f2e">…</text>
  </g>

  <!-- Hilo rojo que une -->
  <path d="M600 260 C760 120 860 520 1010 330" fill="none" stroke="#c8102e" stroke-width="4" stroke-linecap="round"/>
  <circle cx="600" cy="260" r="9" fill="#c8102e"/>
  <circle cx="1010" cy="330" r="9" fill="#c8102e"/>

  <!-- Título -->
  <text x="800" y="96" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="88" fill="#1f1f2e">De<tspan fill="#c8102e" font-style="italic">Lito</tspan></text>
  <text x="800" y="650" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" letter-spacing="4" fill="#3a3a52">DE LA IDEA AL LIBRO ILUSTRADO · CON LA IA COMO AYUDANTE DE TALLER</text>
</svg>
