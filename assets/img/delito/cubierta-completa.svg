<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 870" width="1200" height="870">
  <defs>
    <pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c8102e" stroke-width="2" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="1200" height="870" fill="#f6f0e2"/>
  <text x="600" y="52" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-style="italic" fill="#1f1f2e">Anatomía de la cubierta completa (versión de 63 páginas)</text>
  <text x="600" y="84" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#5d5a55">Se diseña como una sola pieza: contraportada a la izquierda, lomo en el centro y portada a la derecha</text>

  <!-- Sangrado -->
  <rect x="232.0" y="120.0" width="736.3" height="564.2" fill="url(#rayado)"/>
  <!-- Zonas -->
  <rect x="240.8" y="128.8" width="354.2" height="546.7" fill="#fffdf6" stroke="#1f1f2e" stroke-width="1.5"/>
  <rect x="595.0" y="128.8" width="10.4" height="546.7" fill="#1f1f2e"/>
  <rect x="605.3" y="128.8" width="354.2" height="546.7" fill="#fffdf6" stroke="#1f1f2e" stroke-width="1.5"/>

  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="417.9" y="382.1" font-size="26" font-weight="700" fill="#1f1f2e">CONTRAPORTADA</text>
    <text x="417.9" y="414.1" font-size="16" fill="#5d5a55">5,06 × 7,81 in</text>
    <text x="782.4" y="382.1" font-size="26" font-weight="700" fill="#1f1f2e">PORTADA</text>
    <text x="782.4" y="414.1" font-size="16" fill="#5d5a55">5,06 × 7,81 in</text>
    <!-- zona segura sugerida -->
    <rect x="622.8" y="146.2" width="319.2" height="511.7" fill="none" stroke="#2f7d4f" stroke-dasharray="6 5"/>
    <text x="782.4" y="170.2" font-size="13" fill="#2f7d4f">margen de seguridad para textos (orientativo)</text>
  </g>

  <!-- Lomo: llamada -->
  <line x1="600.1" y1="114.0" x2="600.1" y2="104" stroke="#c8102e" stroke-width="2"/>
  <text x="608.1" y="110" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#c8102e">Lomo: 0,148 in (calculado para esa versión)</text>

  <!-- Cotas -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f2e" stroke="#1f1f2e">
    <line x1="232.0" y1="714.2" x2="968.3" y2="714.2" stroke-width="1.5"/>
    <line x1="232.0" y1="706.2" x2="232.0" y2="722.2" stroke-width="1.5"/>
    <line x1="968.3" y1="706.2" x2="968.3" y2="722.2" stroke-width="1.5"/>
    <text x="600.1" y="740.2" text-anchor="middle" stroke="none" font-weight="700">10,518 in de ancho total</text>
    <line x1="998.3" y1="120.0" x2="998.3" y2="684.2" stroke-width="1.5"/>
    <line x1="990.3" y1="120.0" x2="1006.3" y2="120.0" stroke-width="1.5"/>
    <line x1="990.3" y1="684.2" x2="1006.3" y2="684.2" stroke-width="1.5"/>
    <text x="1014.3" y="398.1" stroke="none" font-weight="700">8,060 in</text>
    <text x="1014.3" y="418.1" stroke="none" fill="#5d5a55">de alto</text>
  </g>

  <!-- Leyenda sangrado + suma -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f2e">
    <rect x="40" y="140.0" width="18" height="18" fill="url(#rayado)" stroke="#c8102e" stroke-opacity="0.5"/>
    <text x="66" y="155.0" font-weight="700">Sangrado</text>
    <text x="40" y="178.0" fill="#5d5a55">0,125 in por</text>
    <text x="40" y="198.0" fill="#5d5a55">cada borde</text>
  </g>
  <rect x="232" y="764.2" width="736" height="58" rx="10" fill="#fff" stroke="#e4ddd3"/>
  <text x="600" y="789.2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f2e">0,125 + 5,06 + 0,148 + 5,06 + 0,125 = <tspan font-weight="700">10,518 in</tspan>   ·   0,125 + 7,81 + 0,125 = <tspan font-weight="700">8,060 in</tspan></text>
  <text x="600" y="811.2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c8102e">Valores de una versión concreta: si cambia el número de páginas, cambia el lomo y con él toda la cubierta.</text>
</svg>
