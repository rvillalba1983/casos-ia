<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
<rect width="1200" height="400" fill="#f7efe2"/>
<text x="600" y="52" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-style="italic" fill="#3b2a20">Diez días: de una charla a un sistema</text>
<line x1="140" y1="150" x2="1060" y2="150" stroke="#3b2a20" stroke-width="3"/>
<line x1="140" y1="166" x2="140" y2="190" stroke="#b7791f" stroke-width="2"/>
<circle cx="140" cy="150" r="16" fill="#b7791f"/>
<text x="140" y="118" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#3b2a20">23 oct</text>
<rect x="36" y="190" width="208" height="175" rx="12" fill="#fff" stroke="#b7791f" stroke-width="2"/>
<text x="52" y="228" font-family="Georgia, serif" font-size="22" font-style="italic" fill="#b7791f">Chat</text>
<text x="52" y="260" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3b2a20">Primera tanda de 5</text>
<text x="52" y="282" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3b2a20">artistas. Tarea de los</text>
<text x="52" y="304" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3b2a20">viernes creada.</text>
<line x1="370" y1="166" x2="370" y2="190" stroke="#2f7d4f" stroke-width="2"/>
<circle cx="370" cy="150" r="16" fill="#2f7d4f"/>
<text x="370" y="118" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#3b2a20">25 oct</text>
<rect x="266" y="190" width="208" height="175" rx="12" fill="#fff" stroke="#2f7d4f" stroke-width="2"/>
<text x="282" y="228" font-family="Georgia, serif" font-size="22" font-style="italic" fill="#2f7d4f">Web</text>
<text x="282" y="260" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3b2a20">Diario en GitHub Pages</text>
<text x="282" y="282" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3b2a20">con las Nº 1 y Nº 2.</text>
<text x="282" y="304" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3b2a20">Repo y Pages desde el</text>
<text x="282" y="326" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3b2a20">navegador.</text>
<line x1="600" y1="166" x2="600" y2="190" stroke="#2b5f8f" stroke-width="2"/>
<circle cx="600" cy="150" r="16" fill="#2b5f8f"/>
<text x="600" y="118" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#3b2a20">25 oct</text>
<rect x="496" y="190" width="208" height="175" rx="12" fill="#fff" stroke="#2b5f8f" stroke-width="2"/>
<text x="512" y="228" font-family="Georgia, serif" font-size="22" font-style="italic" fill="#2b5f8f">Reglas</text>
<text x="512" y="260" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3b2a20">Fuera notas internas.</text>
<text x="512" y="282" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3b2a20">Skill radar-de-salas.</text>
<text x="512" y="304" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3b2a20">Todas las entradas</text>
<text x="512" y="326" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3b2a20">iguales.</text>
<line x1="830" y1="166" x2="830" y2="190" stroke="#b5402a" stroke-width="2"/>
<circle cx="830" cy="150" r="16" fill="#b5402a"/>
<text x="830" y="118" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#3b2a20">30 oct</text>
<rect x="726" y="190" width="208" height="175" rx="12" fill="#fff" stroke="#b5402a" stroke-width="2"/>
<text x="742" y="228" font-family="Georgia, serif" font-size="22" font-style="italic" fill="#b5402a">Fallo</text>
<text x="742" y="260" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3b2a20">La tarea del viernes</text>
<text x="742" y="282" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3b2a20">no llega a ejecutarse.</text>
<line x1="1060" y1="166" x2="1060" y2="190" stroke="#2f7d4f" stroke-width="2"/>
<circle cx="1060" cy="150" r="16" fill="#2f7d4f"/>
<text x="1060" y="118" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#3b2a20">2 nov</text>
<rect x="956" y="190" width="208" height="175" rx="12" fill="#fff" stroke="#2f7d4f" stroke-width="2"/>
<text x="972" y="228" font-family="Georgia, serif" font-size="22" font-style="italic" fill="#2f7d4f">Nube</text>
<text x="972" y="260" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3b2a20">Nº 3 a mano. Tres</text>
<text x="972" y="282" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3b2a20">scripts en GitHub. Ya</text>
<text x="972" y="304" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3b2a20">no depende de un</text>
<text x="972" y="326" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3b2a20">ordenador personal.</text>
</svg>