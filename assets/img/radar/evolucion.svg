<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
<rect width="1200" height="520" fill="#f7efe2"/>
<text x="600" y="54" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-style="italic" fill="#3b2a20">Diez días de evolución</text>
<line x1="90" y1="170" x2="1110" y2="170" stroke="#3b2a20" stroke-width="3"/>
<path d="M1110 160 l14 10 l-14 10z" fill="#3b2a20"/>
<circle cx="150" cy="170" r="16" fill="#b5402a"/><text x="150" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#b5402a">23 oct</text>
<rect x="25" y="210" width="250" height="250" rx="14" fill="#fff" stroke="#b5402a" stroke-width="2"/>
<text x="45" y="250" font-family="Georgia, serif" font-size="21" fill="#3b2a20">Recomendador en el chat</text>
<text x="45" y="288" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#4a4540">Cinco artistas a partir de</text>
<text x="45" y="312" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#4a4540">los gustos de Spotify. Se</text>
<text x="45" y="336" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#4a4540">crea la tarea de los</text>
<text x="45" y="360" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#4a4540">viernes.</text>
<line x1="150" y1="186" x2="150" y2="210" stroke="#b5402a" stroke-width="2"/>
<circle cx="450" cy="170" r="16" fill="#b7791f"/><text x="450" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#b7791f">25 oct</text>
<rect x="325" y="210" width="250" height="250" rx="14" fill="#fff" stroke="#b7791f" stroke-width="2"/>
<text x="345" y="250" font-family="Georgia, serif" font-size="21" fill="#3b2a20">Nace la web</text>
<text x="345" y="288" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#4a4540">Diario en GitHub Pages con</text>
<text x="345" y="312" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#4a4540">ventana de conciertos,</text>
<text x="345" y="336" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#4a4540">foto, redes y vídeos. Se</text>
<text x="345" y="360" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#4a4540">crea la skill.</text>
<line x1="450" y1="186" x2="450" y2="210" stroke="#b7791f" stroke-width="2"/>
<circle cx="750" cy="170" r="16" fill="#5d5a55"/><text x="750" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#5d5a55">30 oct</text>
<rect x="625" y="210" width="250" height="250" rx="14" fill="#fff" stroke="#5d5a55" stroke-width="2"/>
<text x="645" y="250" font-family="Georgia, serif" font-size="21" fill="#3b2a20">Un viernes falla</text>
<text x="645" y="288" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#4a4540">La tarea de IA no llega a</text>
<text x="645" y="312" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#4a4540">ejecutarse: la Nº 3 se</text>
<text x="645" y="336" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#4a4540">publica a mano.</text>
<line x1="750" y1="186" x2="750" y2="210" stroke="#5d5a55" stroke-width="2"/>
<circle cx="1050" cy="170" r="16" fill="#2f7d4f"/><text x="1050" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2f7d4f">2 nov</text>
<rect x="925" y="210" width="250" height="250" rx="14" fill="#fff" stroke="#2f7d4f" stroke-width="2"/>
<text x="945" y="250" font-family="Georgia, serif" font-size="21" fill="#3b2a20">Funciona sola</text>
<text x="945" y="288" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#4a4540">Fuera el ordenador. Tres</text>
<text x="945" y="312" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#4a4540">scripts en GitHub y la IA</text>
<text x="945" y="336" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#4a4540">solo para elegir y</text>
<text x="945" y="360" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#4a4540">escribir.</text>
<line x1="1050" y1="186" x2="1050" y2="210" stroke="#2f7d4f" stroke-width="2"/>
</svg>