<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430">
<rect width="1200" height="430" fill="#f7efe2"/>
<text x="600" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-style="italic" fill="#3b2a20">19 días, de la especificación a la versión 1.1.0</text>
<line x1="100" y1="120" x2="1100" y2="120" stroke="#3b2a20" stroke-width="3"/>
<circle cx="100" cy="120" r="14" fill="#6b5a4c"/><text x="100" y="94" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#3b2a20">24 oct</text>
<line x1="100" y1="134" x2="100" y2="156" stroke="#6b5a4c" stroke-width="2"/>
<rect x="25" y="156" width="150" height="230" rx="12" fill="#fff" stroke="#6b5a4c" stroke-width="2"/>
<text x="37" y="186" font-family="Georgia, serif" font-size="17" font-style="italic" fill="#6b5a4c">Especificación</text>
<text x="37" y="214" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3b2a20">Llega la «biblia»</text>
<text x="37" y="234" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3b2a20">del proyecto: la</text>
<text x="37" y="254" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3b2a20">base son las</text>
<text x="37" y="274" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3b2a20">promociones.</text>
<circle cx="267" cy="120" r="14" fill="#b7791f"/><text x="267" y="94" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#3b2a20">25 oct</text>
<line x1="267" y1="134" x2="267" y2="156" stroke="#b7791f" stroke-width="2"/>
<rect x="192" y="156" width="150" height="230" rx="12" fill="#fff" stroke="#b7791f" stroke-width="2"/>
<text x="204" y="186" font-family="Georgia, serif" font-size="17" font-style="italic" fill="#b7791f">Prototipos</text>
<text x="204" y="214" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3b2a20">Interfaz</text>
<text x="204" y="234" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3b2a20">«Warcraft» en</text>
<text x="204" y="254" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3b2a20">pixel art o</text>
<text x="204" y="274" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3b2a20">«Moderna». Gana</text>
<text x="204" y="294" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3b2a20">la moderna.</text>
<circle cx="433" cy="120" r="14" fill="#2b5f8f"/><text x="433" y="94" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#3b2a20">1-2 nov</text>
<line x1="433" y1="134" x2="433" y2="156" stroke="#2b5f8f" stroke-width="2"/>
<rect x="358" y="156" width="150" height="230" rx="12" fill="#fff" stroke="#2b5f8f" stroke-width="2"/>
<text x="370" y="186" font-family="Georgia, serif" font-size="17" font-style="italic" fill="#2b5f8f">Construir</text>
<text x="370" y="214" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3b2a20">Revisión de la PR</text>
<text x="370" y="234" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3b2a20">#1 con 11</text>
<text x="370" y="254" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3b2a20">cambios. Fases 2</text>
<text x="370" y="274" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3b2a20">a 6 en un día.</text>
<circle cx="600" cy="120" r="14" fill="#2b5f8f"/><text x="600" y="94" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#3b2a20">3 nov</text>
<line x1="600" y1="134" x2="600" y2="156" stroke="#2b5f8f" stroke-width="2"/>
<rect x="525" y="156" width="150" height="230" rx="12" fill="#fff" stroke="#2b5f8f" stroke-width="2"/>
<text x="537" y="186" font-family="Georgia, serif" font-size="17" font-style="italic" fill="#2b5f8f">Publicar</text>
<text x="537" y="214" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3b2a20">Publer, Publora,</text>
<text x="537" y="234" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3b2a20">calendario,</text>
<text x="537" y="254" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3b2a20">reintentos y</text>
<text x="537" y="274" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3b2a20">métricas.</text>
<circle cx="767" cy="120" r="14" fill="#b5402a"/><text x="767" y="94" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#3b2a20">8 nov</text>
<line x1="767" y1="134" x2="767" y2="156" stroke="#b5402a" stroke-width="2"/>
<rect x="692" y="156" width="150" height="230" rx="12" fill="#fff" stroke="#b5402a" stroke-width="2"/>
<text x="704" y="186" font-family="Georgia, serif" font-size="17" font-style="italic" fill="#b5402a">Instalar</text>
<text x="704" y="214" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3b2a20">Primer</text>
<text x="704" y="234" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3b2a20">instalador. Falla</text>
<text x="704" y="254" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3b2a20">en el PC de casa;</text>
<text x="704" y="274" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3b2a20">se arregla.</text>
<circle cx="933" cy="120" r="14" fill="#b5402a"/><text x="933" y="94" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#3b2a20">9-11 nov</text>
<line x1="933" y1="134" x2="933" y2="156" stroke="#b5402a" stroke-width="2"/>
<rect x="858" y="156" width="150" height="230" rx="12" fill="#fff" stroke="#b5402a" stroke-width="2"/>
<text x="870" y="186" font-family="Georgia, serif" font-size="17" font-style="italic" fill="#b5402a">Semana real</text>
<text x="870" y="214" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3b2a20">14 propuestas, un</text>
<text x="870" y="234" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3b2a20">fallo de fechas y</text>
<text x="870" y="254" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3b2a20">una tarea</text>
<text x="870" y="274" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3b2a20">dormida.</text>
<circle cx="1100" cy="120" r="14" fill="#2f7d4f"/><text x="1100" y="94" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#3b2a20">12 nov</text>
<line x1="1100" y1="134" x2="1100" y2="156" stroke="#2f7d4f" stroke-width="2"/>
<rect x="1025" y="156" width="150" height="230" rx="12" fill="#fff" stroke="#2f7d4f" stroke-width="2"/>
<text x="1037" y="186" font-family="Georgia, serif" font-size="17" font-style="italic" fill="#2f7d4f">Versión 1.1.0</text>
<text x="1037" y="214" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3b2a20">API de Instagram,</text>
<text x="1037" y="234" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3b2a20">TikTok, macOS,</text>
<text x="1037" y="254" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3b2a20">tutorial. Repo</text>
<text x="1037" y="274" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3b2a20">público.</text>
</svg>